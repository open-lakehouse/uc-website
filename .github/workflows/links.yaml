name: Links

# Dead links, in the sources and in both builds: the default one that
# `bun run build` makes, and the Vercel one that deploys. Internal links and
# anchors are checked offline, so they fail only on this repo's own changes.
# External URLs are checked against the default build, skipping those that
# passed within the last week. They rot between changes, so a weekly run
# re-checks every one of them from main.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1" # Mondays at 07:23 UTC
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same pull request or branch cancels an older one. The
# event is in the group, so a push to main never cancels the weekly run.
concurrency:
  group: links-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sources:
    name: Sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Reports each dead link at its file and line.
      - name: Check internal links and anchors
        run: bun scripts/check-links.mjs --offline

  build:
    name: Build (${{ matrix.preset }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: default
            nitro-preset: ""
            dist: .output/public
            external: true
          - preset: vercel
            nitro-preset: vercel
            dist: .vercel/output/static
            external: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          NITRO_PRESET: ${{ matrix.nitro-preset }}
      # External URLs that passed within the last week, from earlier runs.
      - if: matrix.external
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/check-links
          key: check-links-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: check-links-
      - name: Check links
        env:
          DIST: ${{ matrix.dist }}
          EXTERNAL: ${{ matrix.external }}
          EVENT: ${{ github.event_name }}
        run: |
          flags=(--dist "$DIST")
          if [ "$EXTERNAL" != true ]; then flags+=(--offline); fi
          if [ "$EVENT" = schedule ]; then flags+=(--no-cache); fi
          bun scripts/check-links.mjs "${flags[@]}"
